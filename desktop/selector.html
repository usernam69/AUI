<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Choose part of the screen</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: #000; font: 14px system-ui, sans-serif; }
    #shot { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; }
    #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); }
    #box { position: fixed; border: 2px solid #5b8cff; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45); display: none; }
    #hint { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: #0b1b45; color: #f2f6ff; }
  </style>
</head>
<body>
  <img id="shot" alt="">
  <div id="dim"></div>
  <div id="box"></div>
  <div id="hint">Drag over the part of the screen to ask about. Esc cancels.</div>
  <script src="selector.js"></script>
</body>
</html>
