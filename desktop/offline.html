<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>AUI</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1b45; color: #f2f6ff; font: 16px/1.6 system-ui, sans-serif; text-align: center; padding: 24px; }
    h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: -0.03em; }
    p { margin: 0 0 20px; color: #b9c7e8; }
    button { background: #5b8cff; color: #06102e; border: 0; border-radius: 999px; padding: 12px 26px; font: 600 16px system-ui, sans-serif; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>AUI can't connect.</h1>
    <p id="why">Check your internet connection. AUI needs it the first time it opens.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", () => { location.href = new URLSearchParams(location.search).get("retry") || "https://usernam69.github.io/AUI/chat/"; });
  </script>
</body>
</html>
