name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          cd "AUI Code"
          node scripts/build.js
          mkdir -p ../_site
          cp -r . ../_site
          cd ../_site
          rm -rf supabase scripts package.json pnpm-lock.yaml
          # Project pages are served from /AUI/, so prefix root-absolute links
          find . -name '*.html' -exec sed -i -E 's#(src|href|content)="/([^/"][^"]*)?"#\1="/AUI/\2"#g' {} +
          # The service worker is registered from an inline script in chat/index.html
          find . -name '*.html' -exec sed -i -E 's#register\("/chat/sw\.js"#register("/AUI/chat/sw.js"#' {} +
          # Same for page links and redirect URLs held in JS (the service worker is left alone)
          find . -name '*.js' ! -path './chat/sw.js' -exec sed -i -E 's#"/(chat|beta|about)(/?)(["?])#"/AUI/\1\2\3#g' {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
